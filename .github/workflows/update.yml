name: Update Feather sources

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source files
        run: python3 update_sources.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update sources $(date -u +%F)"
            git push
          fi
